name: Build Spring Boot API
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: room_rental_ci
          POSTGRES_USER: room_rental
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U room_rental -d room_rental_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/room_rental_ci
      DB_USERNAME: room_rental
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Tests, PostgreSQL migrations and executable JAR
        run: gradle clean test bootJar --no-daemon
      - name: Check Docker Compose configuration
        env:
          POSTGRES_DB: room_rental
          POSTGRES_USER: room_rental
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_BASE64: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdLZXlGb3JUb29tUmVudGFsQXBw
        run: docker compose config --quiet
      - name: Verify container startup
        env:
          POSTGRES_DB: room_rental
          POSTGRES_USER: room_rental
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_BASE64: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdLZXlGb3JUb29tUmVudGFsQXBw
        run: |
          docker compose up --build -d --wait --wait-timeout 180
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/actuator/health
      - uses: actions/upload-artifact@v4
        with:
          name: room-rental-backend
          path: build/libs/room-rental-backend.jar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test/
          retention-days: 14
